name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Sintaxis y deps
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verificar sintaxis de bot.py
        run: python -m py_compile bot.py

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Detecta credenciales LITERALES commiteadas (BOT_TOKEN = "abc123..."),
      # distinguiendolas de os.environ["BOT_TOKEN"], que es LEER la variable.
      # Vive en un script aparte: el quoting del shell en un bloque YAML es fragil.
      - name: Verificar que no hay credenciales literales en el repo
        run: bash .github/scripts/check_secrets.sh
